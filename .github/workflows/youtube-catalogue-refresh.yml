name: Refresh YouTube Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  refresh-youtube-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade pip yt-dlp

      - name: Refresh YouTube metadata and page
        run: |
          python3 scripts/import-youtube-catalogue.py --no-fallback
          python3 scripts/render-youtube-catalogue.py

      - name: Push refresh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/youtube-catalogue-refresh || true
          git switch -C codex/youtube-catalogue-refresh
          git add content/youtube-catalogue.json youtube-cv-timeline.html
          if git diff --cached --quiet; then
            echo "No YouTube catalogue changes to push."
            exit 0
          fi
          git commit -m "Refresh YouTube catalogue"
          git push --force-with-lease=codex/youtube-catalogue-refresh origin codex/youtube-catalogue-refresh
